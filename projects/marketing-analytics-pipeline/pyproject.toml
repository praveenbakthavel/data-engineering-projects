[project]
name = "marketing-analytics-pipeline"
version = "0.1.0"
description = "Marketing analytics data pipeline portfolio project"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "duckdb"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
